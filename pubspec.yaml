name: najd_volunteer
description: Najd Volunteer - Volunteer Coordination Mobile App for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.3.0
  provider: ^6.1.1
  intl: ^0.19.0
  url_launcher: ^6.2.4
  # Voice message recording / playback
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# `record` 5.1.2 pins `record_linux: ^0.7.2`, which doesn't implement the
# `startStream` method added in `record_platform_interface` 1.4.0+. Even though
# the linux plugin isn't used on iOS/Android, Flutter still compiles every
# Dart platform implementation, so the build fails. Bumping `record_linux` to
# 1.3.x (which implements `startStream`) unblocks iOS/Android builds.
dependency_overrides:
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1E3A5F"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#1E3A5F"
    image: assets/branding/splash_logo.png
    icon_background_color: "#1E3A5F"
  ios: true
  android: true
  web: false
